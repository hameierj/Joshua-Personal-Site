@media (max-width:340px){.chrome .name{letter-spacing:.08em}.chrome nav{gap:12px}.chrome nav a{letter-spacing:.14em}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ground:#0A0A0B;--ground2:#070605;--ivory:#F2EDE4;--ivory2:#C9C3B8;--mute:#9A948A;--mute2:#6E685F;
  --gold:#C9A24B;--gold-dim:rgba(201,162,75,.32);--hair:rgba(242,237,228,.09);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);--gut:clamp(16px,4.2vw,72px);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ivory);font-family:var(--serif);font-weight:300;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;line-height:1.4}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0;font-weight:300}
em{font-style:italic;font-weight:400;color:var(--gold)}
.num{font-variant-numeric:tabular-nums lining-nums}
.nw{white-space:nowrap}
.disp{letter-spacing:-.012em;line-height:.92}

/* labels: spaced capitals, read second */
.lab{font-family:var(--sans);font-weight:500;font-size:11px;line-height:1.5;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.lab.gold{color:var(--gold)}
.lab .sep{color:var(--gold-dim);padding:0 .55em}
.rule{display:inline-block;width:40px;height:1px;background:var(--gold);vertical-align:middle;margin-right:14px;opacity:.9}

/* chrome */
.chrome{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:22px var(--gut);pointer-events:none;mix-blend-mode:normal;transition:color .5s var(--ease)}
.chrome>*{pointer-events:auto}
.chrome::before{content:"";position:absolute;left:0;right:0;top:0;height:150%;z-index:-1;background:linear-gradient(180deg,rgba(10,10,11,.92),rgba(10,10,11,0));transition:opacity .5s var(--ease)}
body.on-ivory .chrome::before{opacity:0}
.chrome .name{display:inline-flex;align-items:center;color:var(--ivory);white-space:nowrap;transition:color .5s var(--ease)}
.chrome .name .rule{transition:background .5s var(--ease)}
.chrome nav{display:flex;gap:28px}
.chrome nav a{position:relative;padding:14px 0 6px;margin-top:-14px;color:var(--ivory2);transition:color .5s var(--ease)}
.chrome nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .35s var(--ease),background .5s var(--ease)}
.chrome nav a:hover::after{width:100%}
body.on-ivory .chrome .name,body.on-ivory .chrome nav a{color:#0A0A0B}
body.on-ivory .chrome .name .rule{background:#9A7524}
body.on-ivory .chrome nav a::after{background:#0A0A0B}

/* generic section frame */
.sec{position:relative;padding:0 var(--gut)}
.pin{position:relative}
.scene{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;padding:0 var(--gut)}
.hl{position:relative;display:block;height:1px;background:var(--gold-dim)}

/* ---------- hero ---------- */
#hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;position:relative;overflow:hidden;padding-top:96px}
#hero .arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (min-width:901px){#hero .arcs{-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.3) 50%,#000 66%),linear-gradient(180deg,#000 80%,rgba(0,0,0,.3) 88%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,rgba(0,0,0,.3) 50%,#000 66%),linear-gradient(180deg,#000 80%,rgba(0,0,0,.3) 88%);mask-composite:intersect}}
#hero .arcs path{fill:none;stroke:var(--gold);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
body.go #hero .arcs path{animation:draw 2.6s var(--ease) forwards}
body.go #hero .arcs path:nth-child(2){animation-delay:.25s;opacity:.55}
body.go #hero .arcs path:nth-child(3){animation-delay:.5s;opacity:.28}
@keyframes draw{to{stroke-dashoffset:0}}
#hero .bloom{position:absolute;left:-10%;right:-10%;bottom:-40vh;height:90vh;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(242,237,228,.07),rgba(242,237,228,0) 60%)}
#hero .photo{position:absolute;z-index:1;top:0;right:0;bottom:0;width:52%;margin:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(180deg,#000 0,#000 72%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(180deg,#000 0,#000 72%,transparent 100%);mask-composite:intersect}
#hero .photo img{width:100%;height:100%;object-fit:cover;object-position:52% 24%;filter:contrast(1.03) brightness(.96)}
#hero .photo{opacity:0}
body.go #hero .photo{animation:fade 1.6s var(--ease) .1s forwards}
#hero .mid{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:6vh 0 5vh}
#hero h1{font-size:clamp(3.4rem,11.5vw,11.2rem);line-height:.9}
#hero h1 em{font-weight:300}
#hero .sub{margin-top:clamp(28px,4vh,44px);max-width:46ch;font-size:clamp(1.1rem,1.5vw,1.45rem);line-height:1.42;color:var(--ivory2);font-variation-settings:"opsz" 24}
#hero .stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--gold-dim);padding:28px 0 36px}
#hero .stat{position:relative;padding-right:24px}
#hero .stat+.stat{padding-left:28px;border-left:1px solid var(--gold-dim)}
#hero .stat b{display:block;font-weight:300;font-size:clamp(2.1rem,3.9vw,3.6rem);line-height:1;letter-spacing:-.01em;margin-bottom:12px}
#hero .stat .lab{font-size:10.5px}
/* load sequence: words rise, numbers appear whole */
#hero .w{display:inline-block;opacity:0;transform:translateY(22px)}
body.go #hero .w{animation:rise 1.2s var(--ease) forwards}
body.go #hero .w:nth-of-type(2){animation-delay:.35s}
body.go #hero .w:nth-of-type(3){animation-delay:.7s}
#hero .sub{opacity:0}
body.go #hero .sub{animation:rise 1.2s var(--ease) 1.1s forwards}
#hero .stats{opacity:0}
body.go #hero .stats{animation:fade .01s linear 1.5s forwards}
#hero .stat b{clip-path:inset(0 100% 0 0)}
body.go #hero .stat b{animation:wipe .9s var(--ease) 1.55s forwards}
body.go #hero .stat:nth-child(2) b{animation-delay:1.75s}
body.go #hero .stat:nth-child(3) b{animation-delay:1.95s}
#hero .stat .lab{opacity:0}
body.go #hero .stat .lab{animation:fade 1s var(--ease) 2.3s forwards}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}

/* ---------- about ---------- */
#about{padding:20vh var(--gut) 16vh}
#about .ladder{list-style:none;margin:7vh 0 0;padding:0}
#about .ladder li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;align-items:end;padding:34px 0;border-top:1px solid var(--hair)}
#about .beat{margin-top:14px;font-size:clamp(2.2rem,4.4vw,4.6rem);line-height:1}
#about .proof{max-width:40ch;font-size:clamp(1.02rem,1.25vw,1.2rem);line-height:1.5;color:var(--ivory2);font-variation-settings:"opsz" 24}
#about .now{margin-top:6vh;display:flex;justify-content:space-between;align-items:baseline;gap:20px 40px;flex-wrap:wrap;border-top:1px solid var(--gold-dim);padding-top:28px}
#about .now p{max-width:46ch;font-size:clamp(1.15rem,1.6vw,1.5rem);line-height:1.4;color:var(--ivory)}
#about .now a{color:var(--gold);padding:14px 0;margin:-14px 0}

/* ---------- the exit: one scene, copy laid over the team photo ---------- */
#exit .scene{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr auto auto;column-gap:48px;padding-top:88px;padding-bottom:40px;min-height:max(100svh,66vw)}
#exit .pic{position:absolute;inset:0;margin:0;z-index:0}
#exit .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:contrast(1.03) brightness(.92)}
#exit .pic::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(10,10,11,.55) 0,rgba(10,10,11,0) 14%,rgba(10,10,11,0) 34%,rgba(10,10,11,.72) 58%,rgba(10,10,11,.94) 78%,#0A0A0B 100%)}
#exit .left,#exit .right,#exit .strip{position:relative;z-index:2}
#exit .left{grid-row:2;display:flex;flex-direction:column;justify-content:flex-end;padding:4vh 0 6vh}
#exit h2{font-size:clamp(2.4rem,5.6vw,5.6rem)}
#exit .sent{margin-top:28px;max-width:40ch;font-size:clamp(1.05rem,1.35vw,1.3rem);line-height:1.45;color:var(--ivory2);font-variation-settings:"opsz" 24}
#exit .right{grid-row:2;display:flex;align-items:flex-end;justify-content:flex-end;padding:4vh 0 6vh}
#exit .poster{position:relative;font-size:clamp(5.2rem,15vw,15rem);font-weight:200;line-height:.82;letter-spacing:-.03em}
#exit .strip{grid-column:1/-1;grid-row:3;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--gold-dim);padding-top:22px}

/* ---------- the platform ---------- */

/* ---------- the operator (ivory) ---------- */
#operator .pin{background:var(--ivory)}
#operator .scene{background:var(--ivory);color:#0A0A0B;display:grid;grid-template-rows:auto 1fr auto;padding-top:88px;padding-bottom:36px}
#operator .scene::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.08) 100%)}
#operator .lab{color:#6E685F}
#operator .rule{background:#9A7524}
#operator .curve{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#operator .curve path{fill:none;stroke:#0A0A0B;stroke-width:1.5;vector-effect:non-scaling-stroke}
#operator .curve .tick{stroke:#9A7524;stroke-width:1.5;vector-effect:non-scaling-stroke}
#operator .tag{position:absolute;font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.14em;color:#9A7524}
#operator .tag.t1{left:calc(5.625% + 12px);bottom:calc(20% + 10px)}
#operator .tag.t2{right:calc(5% + 16px);top:calc(16.7% - 7px);text-align:right}
#operator .body{position:relative;z-index:2;display:flex;align-items:flex-end;gap:3vw;flex-wrap:wrap;align-self:center}
#operator .mult{font-size:clamp(8rem,24vw,24rem);font-weight:200;line-height:.78;letter-spacing:-.04em}
#operator .mult em{color:#9A7524;font-weight:200;font-style:normal;margin-left:.04em}
#operator h2{font-size:clamp(1.8rem,3.4vw,3.6rem);line-height:1.02;padding-bottom:.4em}
#operator .figs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);margin:40px 0 0;border-top:1px solid rgba(10,10,11,.18)}
#operator .figs div{padding:22px 24px 0 0}
#operator .figs div+div{padding-left:24px;border-left:1px solid rgba(10,10,11,.14)}
#operator .figs dd{margin:10px 0 0;font-size:clamp(1.9rem,3vw,3rem);line-height:1;font-weight:300}
#operator .figs dd.txt{font-size:clamp(1rem,1.2vw,1.15rem);line-height:1.4;color:#3A3732;font-variation-settings:"opsz" 24}

/* ---------- the rooms ---------- */
#rooms{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding-top:120px;padding-bottom:9vh}
#rooms .giant{margin-top:6vh;font-size:clamp(6rem,23vw,24rem);font-weight:200;line-height:.8;letter-spacing:-.045em;white-space:nowrap}
#rooms .giant em{font-weight:200}
#rooms .under{margin-top:2.4vh;font-size:clamp(1.4rem,2.6vw,2.6rem);line-height:1.15;color:var(--ivory2)}
#rooms .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;margin-top:auto;padding-top:28px;border-top:1px solid var(--gold-dim)}
#rooms .col+.col{padding-left:56px;border-left:1px solid var(--gold-dim)}
#rooms .col h3{margin-top:14px;font-size:clamp(1.8rem,3vw,3rem);line-height:1}
#rooms .col p{margin-top:14px;max-width:42ch;font-size:clamp(1.02rem,1.25vw,1.2rem);line-height:1.5;color:var(--ivory2);font-variation-settings:"opsz" 24}
#rooms .bloom{position:absolute;left:30%;top:30%;width:50vw;height:40vh;pointer-events:none;background:radial-gradient(ellipse,rgba(242,237,228,.05),rgba(242,237,228,0) 70%)}

/* ---------- the face ---------- */
#face{position:relative;padding:16vh 0 14vh}
#face .copy{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 1fr;gap:0 7vw;align-items:end;padding:0 var(--gut)}
#face blockquote{margin:32px 0 0;font-size:clamp(1.8rem,3.5vw,3.6rem);line-height:1.04}
#face blockquote em{white-space:nowrap}
#face blockquote .l2{display:block;margin-top:.5em;font-size:.56em;color:var(--ivory2);line-height:1.2}
#face .who{margin-top:28px}
#face .princ{list-style:none;margin:0;padding:0}
#face .princ li{position:relative;display:grid;grid-template-columns:40px 1fr;gap:12px;padding:15px 0;font-size:clamp(1rem,1.2vw,1.18rem);line-height:1.42;color:var(--ivory2);font-variation-settings:"opsz" 24}
#face .princ li .hl{position:absolute;left:0;right:0;top:0}
#face .princ li i{font-style:italic;color:var(--gold);font-weight:400}

/* ---------- the record ---------- */
#record{padding-top:18vh;padding-bottom:12vh}
#record .title{font-size:clamp(4rem,12vw,12.5rem);font-style:italic;font-weight:300;color:var(--gold);line-height:.9;letter-spacing:-.02em}
#record .kick{margin-top:9vh;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
#record .rows{list-style:none;margin:28px 0 0;padding:0}
#record .rows li{position:relative;display:grid;grid-template-columns:minmax(220px,34%) 1fr;gap:28px 48px;padding:44px 0 46px;align-items:start}
#record .rows li .hl{position:absolute;left:0;right:0;top:0}
#record .rows li .lab{display:block}
#record .rows li h3{margin-top:10px;font-size:clamp(1.25rem,1.7vw,1.6rem);line-height:1.2;font-variation-settings:"opsz" 36}
#record .rows li p{font-size:clamp(1.02rem,1.25vw,1.2rem);line-height:1.5;color:var(--ivory2);max-width:60ch;font-variation-settings:"opsz" 24;padding-top:30px}
#record .rows li.now .lab{color:var(--gold)}
#record .end{height:1px;background:var(--gold-dim)}

/* ---------- the close ---------- */
#close{position:relative;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr;padding-top:120px;padding-bottom:12vh;overflow:hidden;background:linear-gradient(180deg,var(--ground) 0%,var(--ground) 40%,var(--ground2) 100%)}
#close .arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
#close .arcs path{fill:none;stroke:var(--gold);stroke-width:1;vector-effect:non-scaling-stroke}
#close .arcs path:nth-child(2){opacity:.55}
#close .arcs path:nth-child(3){opacity:.28}
#close .glow{position:absolute;left:50%;bottom:-30vh;width:140vw;height:80vh;transform:translateX(-50%);pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(201,162,75,.08),rgba(201,162,75,0) 60%)}
#close .body{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center}
#close h2{font-size:clamp(2.6rem,7vw,7.4rem);max-width:15ch}
#close .sub{margin-top:30px;max-width:44ch;font-size:clamp(1.05rem,1.4vw,1.35rem);line-height:1.45;color:var(--ivory2);font-variation-settings:"opsz" 24}
#close .links{display:flex;gap:40px;flex-wrap:wrap;margin-top:48px}
#close .links a{position:relative;display:inline-flex;align-items:baseline;gap:12px;padding:14px 0 10px;margin-top:-14px;color:var(--ivory)}
#close .links a .lab{color:var(--ivory)}
#close .links a .addr{font-family:var(--serif);font-size:1.05rem;color:var(--ivory2)}
#close .links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold-dim);transition:background .35s var(--ease)}
#close .links a:hover::after{background:var(--gold)}
#close .colophon{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1.6fr;gap:24px;border-top:1px solid var(--hair);padding:26px 0 30px;margin-top:14vh}
#close .colophon p{font-family:var(--sans);font-size:11px;line-height:1.6;color:var(--mute2);letter-spacing:.02em}
#close .colophon p.right{text-align:right}

/* ---------- static (reduced motion) ---------- */
html.static #hero .photo,html.static #hero .w,html.static #hero .sub,html.static #hero .stats,html.static #hero .stat .lab{opacity:1!important;transform:none!important;animation:none!important}
html.static #hero .stat b{clip-path:none!important;animation:none!important}
html.static #hero .arcs path{stroke-dashoffset:0!important;animation:none!important}

/* ---------- phone ---------- */
@media (max-width:900px){
  .chrome{padding:18px var(--gut)}
  .chrome .name .rule{width:22px;margin-right:10px}
  .chrome nav{gap:20px}
  #hero{padding-top:84px}
  #hero .photo{position:relative;top:auto;right:auto;bottom:auto;width:calc(100% + 2 * var(--gut));height:52vh;margin:-84px calc(-1 * var(--gut)) -14vh;
    -webkit-mask-image:linear-gradient(180deg,#000 0,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 55%,transparent 100%)}
  #hero .photo::after{background:linear-gradient(180deg,rgba(10,10,11,.35) 0,rgba(10,10,11,0) 22%)}
  #hero{grid-template-rows:auto 1fr auto}
  #hero .mid{padding:5vh 0 4vh}
  #hero .stats{grid-template-columns:1fr;padding:0 0 28px}
  #hero .stat{padding:20px 0}
  #hero .stat+.stat{padding-left:0;border-left:0;border-top:1px solid var(--gold-dim)}
  #hero .stat b{margin-bottom:8px}
  #hero .arcs{-webkit-mask-image:linear-gradient(180deg,#000 42%,rgba(0,0,0,.35) 58%);mask-image:linear-gradient(180deg,#000 42%,rgba(0,0,0,.35) 58%)}
  #about{padding:14vh var(--gut) 12vh}
  #about .ladder li{grid-template-columns:1fr;gap:10px;padding:22px 0}
  #exit .scene{display:flex;flex-direction:column;justify-content:flex-end;padding-top:0;padding-bottom:28px;min-height:0}
  #exit .pic{position:relative;inset:auto;order:-1;height:auto;aspect-ratio:4/5;margin:0 calc(-1 * var(--gut))}
  #exit .pic img{object-position:78% 30%}
  #exit .pic::after{background:linear-gradient(180deg,rgba(10,10,11,.6) 0,rgba(10,10,11,0) 16%,rgba(10,10,11,0) 44%,rgba(10,10,11,.8) 76%,#0A0A0B 100%)}
  #exit .left{display:contents}
  #exit h2{order:1;margin-top:-30vw;position:relative;z-index:2}
  #exit .sent{position:relative;z-index:2}
  #exit .right{order:2;justify-content:flex-start;align-items:flex-start;padding:0;margin:4vh 0 3vh}
  #exit .sent{order:3;margin-top:0}
  #exit .strip{order:4;margin-top:28px;padding-top:16px}
  #exit .poster{font-size:clamp(5rem,27vw,9rem)}
  #operator .scene{padding-top:80px;padding-bottom:26px}
  #operator .curve{top:15%;height:26%}
  #operator .tag.t1{bottom:auto;top:calc(35.8% - 26px)}
  #operator .tag.t2{top:calc(19.3% - 7px)}
  #operator .body{align-self:end;margin-top:34vh}
  #operator .mult{font-size:clamp(7rem,40vw,10rem)}
  #operator h2{font-size:clamp(1.5rem,6.5vw,2rem)}
  #operator .figs{grid-template-columns:1fr 1fr;margin-top:28px}
  #operator .figs div,#operator .figs div+div{padding:16px 12px 16px 0;border-left:0}
  #operator .figs div:nth-child(even){padding-left:16px;border-left:1px solid rgba(10,10,11,.14)}
  #operator .figs div:nth-child(n+3){border-top:1px solid rgba(10,10,11,.14)}
  #operator .figs dd{font-size:clamp(1.6rem,8vw,2.2rem)}
  #rooms{padding-top:100px}
  #rooms .giant{font-size:clamp(4.4rem,26vw,7rem);margin-top:4vh}
  #rooms .under{font-size:1.25rem}
  #rooms .cols{grid-template-columns:1fr;margin-top:8vh}
  #rooms .col+.col{padding-left:0;border-left:0;margin-top:28px;padding-top:28px;border-top:1px solid var(--hair)}
  #face{padding:12vh 0 10vh}
  #face .copy{grid-template-columns:1fr}
